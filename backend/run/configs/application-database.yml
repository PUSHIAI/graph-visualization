spring:
  datasource:
    url: jdbc:h2:file:./H2DB/graph
    username: sa
    password: 123
    driverClassName: org.h2.Driver
    tomcat:
      default-auto-commit: true
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 30
      minimum-idle: 5
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        #show_sql: true
        use_sql_comments: true
        format_sql: true
